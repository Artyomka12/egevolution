<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание пользователя | Админ-панель</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
        }

        .header h1 {
            font-size: 1.6em;
        }

        .btn-back {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .form-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
        }

        .flash-msg {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: rgba(40, 167, 69, 0.2);
            color: #4ade80;
            border: 1px solid #28a745;
        }

        .error {
            background: rgba(220, 53, 69, 0.2);
            color: #f87171;
            border: 1px solid #dc3545;
        }

        .form-field {
            margin-bottom: 18px;
        }

        .form-field label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: #a855f7;
            font-weight: 600;
        }

        .form-field input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
        }

        .form-field input:focus {
            outline: none;
            border-color: #a855f7;
        }

        .form-hint {
            margin-top: 6px;
            font-size: 0.8em;
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="/admin" class="btn-back">← Назад в админ-панель</a>
            <h1>➕ Новый пользователь</h1>
            <div></div>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-msg {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <div class="form-card">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-field">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" value="{{ prefill_name or '' }}" maxlength="32" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="username">Логин</label>
                    <input type="text" id="username" name="username" maxlength="16" required autocomplete="off">
                </div>
                <div class="form-field">
                    <label for="password">Пароль</label>
                    <input type="text" id="password" name="password" maxlength="16" required autocomplete="off">
                    <div class="form-hint">Пароль виден при вводе — сразу передайте его ученику.</div>
                </div>
                <button type="submit" class="btn-submit">Создать пользователя</button>
            </form>
        </div>
    </div>
</body>

</html>
