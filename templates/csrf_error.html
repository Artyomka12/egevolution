<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка безопасности | ЕГЭ Информатика</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 16px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .icon { font-size: 3em; margin-bottom: 20px; }
        h1 { color: #ef4444; font-size: 1.5em; margin: 0 0 12px; }
        p  { color: #94a3b8; line-height: 1.6; margin: 0 0 28px; }
        .reason {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.85em;
            color: #fca5a5;
            margin-bottom: 28px;
            word-break: break-word;
        }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #e0e0e0;
            text-decoration: none;
            transition: background 0.2s;
        }
        a:hover { background: rgba(255,255,255,0.12); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Ошибка безопасности</h1>
        <p>Запрос не прошёл проверку безопасности. Возможно, форма устарела — попробуйте обновить страницу и повторить действие.</p>
        {% if reason %}
        <div class="reason">{{ reason }}</div>
        {% endif %}
        <a href="javascript:history.back()">← Назад</a>
    </div>
</body>
</html>
