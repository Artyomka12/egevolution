<header class="header"><h1>Проверка ответов</h1><p>Демонстрационная попытка. Изменения действуют только до закрытия страницы.</p></header>
<section class="panel attempt-summary" aria-label="Информация о попытке"><div><div class="student">Александр Смирнов</div><div class="test-name">Основы информатики и Python</div><div class="muted">Попытка № 2 · 13 октября 2026, 14:35</div></div><div class="result" aria-live="polite"><div id="result-label" class="muted"></div><strong id="result-value"></strong><div id="counts" class="muted"></div></div></section>
<div class="workspace"><aside class="panel sidebar"><h2>Вопросы попытки</h2><ol id="question-list" class="question-list"></ol></aside><section class="panel" aria-label="Проверка выбранного вопроса"><div id="detail"></div><div class="next-row"><button class="action" id="next-pending" type="button">Следующий непроверенный →</button><span class="muted" id="next-hint" aria-live="polite"></span></div></section></div>
</main><script>
const diagram = `<svg xmlns="http://www.w3.org/2000/svg" width="280" height="260" viewBox="160 0 280 260"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs><g fill="#fff" stroke="#93b4ed" stroke-width="2"><rect x="190" y="18" width="220" height="48" rx="24"/><rect x="190" y="104" width="220" height="48" rx="8"/><rect x="190" y="190" width="220" height="48" rx="24"/></g><g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"><path d="M300 66V99"/><path d="M300 152V185"/></g><g font-family="Segoe UI, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle"><text x="300" y="49">Ввод x</text><text x="300" y="135">y = x * 2 + 3</text><text x="300" y="221">Вывод y</text></g></svg>`;
const questions = [
 {type:'single',title:'Единицы измерения информации',text:'Сколько бит содержится в одном байте?',options:['4 бита','8 бит','16 бит','32 бита']},
 {type:'multiple',title:'Типы данных в Python',text:'Выберите все выражения, результатом которых является целое число (тип int).',options:['7 // 2','7 / 2','int("12")','len("Python")','3.0 + 2']},
 {type:'short',title:'Перевод из двоичной системы',text:'Переведите двоичное число 101101 в десятичную систему счисления. Введите только число.',hint:'Короткий ответ'},
 {type:'long',title:'Как найти наибольшее число?',text:'Вам дан непустой список целых чисел. Опишите алгоритм поиска наибольшего элемента без использования функции max().\n\nУкажите начальное значение переменной, способ просмотра элементов и условие её изменения. Объясните, почему алгоритм будет работать, даже если все числа в списке отрицательные. Можно использовать обычный текст или код Python.',hint:'Запишите объяснение или фрагмент кода. Этот ответ предполагает ручную проверку.'},
 {type:'short',title:'Прочитайте схему алгоритма',text:'На вход алгоритма подали число 7. Какое число будет выведено после выполнения действий, показанных на схеме?',image:true,hint:'Введите число'},
 {type:'single',title:'Результат выполнения цикла',text:'Что выведет эта программа?',code:'s = 0\nfor i in range(1, 5):\n    s += i\nprint(s)',options:['10','15','Программа завершится с ошибкой']},
 {type:'multiple',title:'Логические выражения',text:'Пусть x = 7. Выберите все выражения, которые принимают значение True.',options:['x > 5 and x < 10','x % 2 == 0','not (x == 3)','x < 0 or x == 7']},
 {type:'long',title:'Почему изменились оба списка?',text:'Ученик хотел получить независимую копию списка a. После выполнения программы изменилось и содержимое a.\n\nОбъясните причину и предложите одно исправление, чтобы добавление элемента в b не меняло a.',code:'a = [1, 2, 3]\nb = a\nb.append(4)\nprint(a)',hint:'Напишите объяснение и исправленную строку кода.'}
];

// Ответы отделены от оценок и остаются неизменными.
const studentAnswers=Object.freeze(['8 бит','7 // 2; int("12"); len("Python")','43','largest = numbers[0]\nfor value in numbers:\n    if value > largest:\n        largest = value\n\nНачинаем с первого элемента, а не с нуля. Поэтому алгоритм работает и для отрицательных чисел. Каждый следующий элемент сравниваем с текущим максимумом.','','10','x > 5 and x < 10; x % 2 == 0','b = a создаёт ещё одну ссылку на тот же список. Поэтому append изменяет общий объект.\n\nИсправление: b = a.copy(). В данном примере элементы — числа, поэтому такой копии достаточно.']);
// Неизменный снимок эталонов версии, связанной с этой попыткой.
// Он не связан с редактируемым тестом или данными конструктора.
const attemptVersion=Object.freeze({
  id:'informatics-python-v1',
  correctAnswers:Object.freeze([
    Object.freeze(['8 бит']),
    Object.freeze(['7 // 2','int("12")','len("Python")']),
    Object.freeze(['45']),
    null,
    Object.freeze(['17']),
    Object.freeze(['10']),
    Object.freeze(['x > 5 and x < 10','not (x == 3)','x < 0 or x == 7']),
    null
  ])
});
const methods=Object.freeze(['auto','auto','auto','manual','auto','auto','auto','manual']);
const grades=[1,1,0,null,0,1,0,null];
const overridden=questions.map(()=>false);
let selected=3;
const $=id=>document.getElementById(id);
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(i) { if(grades[i]===null)return ['pending','Ожидает проверки']; if(grades[i]===1)return ['correct','Правильно']; if(!studentAnswers[i])return ['skipped','Пропущено']; return ['incorrect','Неправильно']; }
function renderSummary(){ const pending=grades.filter(g=>g===null).length; const checked=grades.length-pending; const score=grades.reduce((sum,g)=>sum+(g===1?1:0),0); $('result-label').textContent=pending?'Предварительный результат':'Окончательный результат'; $('result-value').textContent=pending?score+' из '+checked+' проверенных':score+' из 8 баллов · '+(score/8*100).toLocaleString('ru-RU')+'%'; $('counts').textContent='Проверено: '+checked+' из 8 · Ожидают: '+pending; $('next-pending').disabled=!pending; $('next-hint').textContent=pending?'Осталось проверить: '+pending:'Все вопросы проверены'; }
function renderList(){ $('question-list').innerHTML=questions.map((q,i)=>{const [cls,label]=status(i);return '<li><button type="button" class="question-button" data-question="'+i+'" aria-current="'+(i===selected)+'"><strong>'+ (i+1)+'. '+escapeHtml(q.title)+'</strong><span class="status '+cls+'">'+label+'</span></button></li>';}).join(''); }
function renderAnswers(i){
  const reference=attemptVersion.correctAnswers[i];
  const student=questions[i].type==='multiple'?studentAnswers[i].split('; ').join('\n'):studentAnswers[i];
  const own='<div><h3>Ответ ученика</h3><div class="answer prose">'+escapeHtml(student||'Ответ не дан')+'</div></div>';
  if(reference===null)return '<div class="content-block">'+own+'</div>';
  return '<div class="content-block answer-comparison">'+own+'<div><h3>Правильный ответ</h3><div class="answer prose">'+reference.map(escapeHtml).join('\n')+'</div></div></div>';
}
function renderDetail(){ const q=questions[selected], [cls,label]=status(selected); const manual=methods[selected]==='manual'; $('detail').innerHTML='<div class="detail-top"><h2>'+ (selected+1)+'. '+escapeHtml(q.title)+'</h2><span class="points">Максимум: 1 балл</span></div><div class="content-block"><h3>Исходное условие</h3><div class="prose">'+escapeHtml(q.text)+'</div>'+(q.code?'<pre><code>'+escapeHtml(q.code)+'</code></pre>':'')+(q.image?'<img class="diagram" alt="Схема: ввод x, вычисление y = x * 2 + 3, вывод y" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(diagram)+'">':'')+(q.options?'<ol class="original-options">'+q.options.map(o=>'<li>'+escapeHtml(o)+'</li>').join('')+'</ol>':'')+'</div>'+renderAnswers(selected)+'<div class="grading"><div class="grading-meta"><div><h3>Способ проверки</h3><div class="muted">'+(manual?'Ручная':'Автоматическая')+(!manual&&overridden[selected]?' · оценка исправлена вручную':'')+'</div></div><div><h3>Текущая оценка</h3><span class="status '+cls+'">'+label+'</span> <span class="muted">'+(grades[selected]===null?'Не выставлена':grades[selected]+' / 1 балл')+'</span></div></div><h3>'+(manual?'Выставить оценку':'Исправить оценку вручную')+'</h3><div class="grade-actions"><button type="button" class="action action-publish" data-grade="1" aria-pressed="'+(grades[selected]===1)+'">Правильно · 1 балл</button><button type="button" class="btn-delete" data-grade="0" aria-pressed="'+(grades[selected]===0)+'">Неправильно · 0 баллов</button></div></div>'; }
function render(){renderSummary();renderList();renderDetail();}
$('question-list').addEventListener('click',e=>{const button=e.target.closest('[data-question]');if(!button)return;selected=Number(button.dataset.question);render();$('question-list').querySelectorAll('button')[selected].focus({preventScroll:true});});
$('detail').addEventListener('click',e=>{const button=e.target.closest('[data-grade]');if(!button)return;const grade=Number(button.dataset.grade);grades[selected]=grade;overridden[selected]=true;render();$('detail').querySelector('[data-grade="'+grade+'"]').focus({preventScroll:true});});
$('next-pending').addEventListener('click',()=>{for(let offset=1;offset<=questions.length;offset++){const i=(selected+offset)%questions.length;if(grades[i]===null){selected=i;render();break;}}});
render();
</script></body></html>
